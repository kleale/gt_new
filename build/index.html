<script>
        page_match = 1;
        function mvideo(num) {
            $.ajax({type:'POST',data:{game:game_eng,rid:'matches',ajax:'block_video',data:{id:598095,'num':num}}}).done(function(txt){
                $('#video').html(txt);
                $('#videos li').removeClass('active');
                $('#videos li[rel='+num+']').addClass('active');
                if ($('#gvlist').length) {
                	$('#gvlist').TrackpadScrollEmulator({autoHide: false});
                }
                mvideo_top();
            });
        }
        function mvideo_top() {
            var kol = $('#video a.video').length;
            if ($('#video a.g-rezults').length) kol += 1;
            if ($('#video a.g-d2m').length) kol += 1;
            var top = (kol > 3 ? 120 : 200 - kol*20);
            $('#video .gamevid').css({'top':top+'px'});
        }
        function match_result(num) {
            $.ajax({type:'POST',data:{game:game_eng,rid:'matches',ajax:'match_result',data:{'mid':598095,'num':num}}}).done(function(txt) {
        		wms('Результаты игры',txt);
        	});
        }
        $(document).ready(function() {
            mvideo_top();
            $('.btxt').on('contextmenu', function(e){
                e.preventDefault();
            });
            $('.fancybox').fancybox();
        	$('.video').fancybox({
        		arrows : false,
        		helpers: {
                    media: true
                }
        	});
        	if ($('#gvlist').length) {
            	$('#gvlist').TrackpadScrollEmulator({autoHide: false});
            }
			
			$('.match-nav').perfectScrollbar();
			
        });
    </script>
